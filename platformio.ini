; FlightRadar firmware for the Waveshare ESP32-S3-RLCD-4.2
; Uses pioarduino (Arduino-ESP32 3.x / ESP-IDF 5.x), which the board's
; display and audio code from Waveshare requires.

[env:rlcd42]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.313/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino

board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.arduino.memory_type = qio_opi
board_build.partitions = partitions.csv
board_build.filesystem = littlefs

build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DCORE_DEBUG_LEVEL=1

lib_deps =
    bblanchon/ArduinoJson @ ^7.2.0
    adafruit/Adafruit GFX Library @ ^1.11.11
    bitbank2/PNGdec @ ^1.0.3
    ricmoo/QRCode @ ^0.0.1

extra_scripts = pre:tools/embed_web.py

monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; Wireless updates after the first USB flash:
;   pio run -e rlcd42-ota -t upload
[env:rlcd42-ota]
extends = env:rlcd42
upload_protocol = espota
upload_port = flightradar.local
