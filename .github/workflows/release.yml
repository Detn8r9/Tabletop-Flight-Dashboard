# Builds the firmware and publishes a GitHub release when you push a tag
# like v1.3.1. Radars with automatic updates turned on pick it up within a
# day (or right away with "Check for updates" on their settings page).
#
#   1. Bump FW_VERSION in src/config.h (e.g. "1.3.1")
#   2. git commit -am "v1.3.1" && git tag v1.3.1 && git push --follow-tags
#
# The tag must match FW_VERSION, or radars will keep re-installing it.
name: Release firmware

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches FW_VERSION
        run: |
          v=$(grep -oP '#define FW_VERSION "\K[^"]+' src/config.h)
          if [ "v$v" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match FW_VERSION $v in src/config.h"; exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ hashFiles('platformio.ini') }}

      - name: Build
        run: |
          pip install platformio
          pio run -e rlcd42

      - name: Collect files
        run: |
          mkdir out
          cp .pio/build/rlcd42/firmware.bin out/firmware.bin
          cp .pio/build/rlcd42/firmware.factory.bin out/flightradar-full.bin

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            out/firmware.bin
            out/flightradar-full.bin
          body: |
            **firmware.bin**: wireless update (settings page > System > Advanced > Firmware update). Radars with automatic updates install it by themselves.
            **flightradar-full.bin**: complete image for a USB flash at address 0x0 (erases settings).
