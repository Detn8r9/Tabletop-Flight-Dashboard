# One-time job: publishes GitHub releases for the versions made before
# automatic releases existed (1.0.0 to 1.2.0), built from their commits in the
# history. Releases that already exist are skipped, so it's safe to re-run.
# None of them is marked "latest", so radars never downgrade to them.
name: Publish earlier releases

on:
  push:
    branches: [main]
    paths: [".github/workflows/backfill-releases.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency: release

jobs:
  release:
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 1   # oldest first, so the releases list stays in order
      fail-fast: false
      matrix:
        include: [{"version": "1.0.0", "sha": "0693b60727f096b201c561e73b7aec9e00a1b154", "notes": "The first radar: a spinning sweep over a terrain map, live planes from free community networks, a settings page with location, zoom, filters by kind of aircraft and model, alerts and night mode, and a Wi-Fi setup hotspot with QR code. Radar fills the whole screen."}, {"version": "1.1.0", "sha": "64d7bec01c806faaf7032b259b6ebafda15e4c3e", "notes": "Little plane and helicopter icons; a black-and-white OpenStreetMap street map instead of terrain; plain-English labels (\"Delta 1234 / Boeing 737 / 35,000 ft\"); feet + mph by default with knots and metric options; a Closest box in the side panel; \"seen today\" counter; Help tab; tidier settings."}, {"version": "1.1.1", "sha": "92ced312d3e2d2079e6beb6f0fda8e14c8a68957", "notes": "Flight data now comes from adsb.lol with adsb.fi as backup, after airplanes.live started refusing unregistered apps. Switches source immediately when one refuses, and shows the reason on screen."}, {"version": "1.1.2", "sha": "4e55e3cd6c12de3f382ab93cad1efb7e4661372d", "notes": "Downloads each plane list in full before reading it (fixes \"JSON IncompleteInput\"), and caps requests at 100 nautical miles."}, {"version": "1.1.3", "sha": "f0feeaddfca397691df4c9182b6231b19da01bb2", "notes": "The plane counter matches the planes drawn on screen, and the settings page reloads itself after a firmware update."}, {"version": "1.2.0", "sha": "3632b364ce7693a85a13fa52de0c4731340bc50d", "notes": "Town names and airports (with codes like JFK, LGA) drawn on the map, from built-in GeoNames and OurAirports data. Town names can be switched off."}]
    steps:
      - name: Skip if v${{ matrix.version }} is already released
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v${{ matrix.version }}" -R "${{ github.repository }}" >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.check.outputs.skip != 'true'
        with:
          ref: ${{ matrix.sha }}

      - uses: actions/setup-python@v5
        if: steps.check.outputs.skip != 'true'
        with:
          python-version: "3.12"

      - uses: actions/cache@v4
        if: steps.check.outputs.skip != 'true'
        with:
          path: ~/.platformio
          key: pio-${{ hashFiles('platformio.ini') }}

      - name: Build v${{ matrix.version }}
        if: steps.check.outputs.skip != 'true'
        run: |
          pip install platformio
          pio run -e rlcd42
          mkdir out
          cp .pio/build/rlcd42/firmware.bin out/firmware.bin
          cp .pio/build/rlcd42/firmware.factory.bin out/flightradar-full.bin

      - name: Publish v${{ matrix.version }}
        if: steps.check.outputs.skip != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ matrix.version }}
          target_commitish: ${{ matrix.sha }}
          name: Tabletop Flight Dashboard v${{ matrix.version }}
          make_latest: "false"
          files: |
            out/firmware.bin
            out/flightradar-full.bin
          body: |
            ${{ matrix.notes }}

            *Earlier version, kept for reference. The newest version is under [Releases](https://github.com/${{ github.repository }}/releases/latest).*
