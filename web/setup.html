<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>FlightRadar setup</title>
<style>
:root{--bg:#0b120e;--card:#132019;--line:#24382c;--fg:#e4efe7;--mut:#8ea597;--acc:#5ef08a}
*{box-sizing:border-box}body{margin:0;font:16px/1.45 -apple-system,system-ui,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--fg)}
main{max-width:460px;margin:0 auto;padding:22px 16px 40px}
h1{font-size:24px;margin:6px 0 4px}p{color:var(--mut);margin:0 0 18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:14px}
.net{display:flex;justify-content:space-between;align-items:center;padding:12px 10px;border-radius:10px;cursor:pointer}
.net:hover,.net.sel{background:#1c2f24}.net small{color:var(--mut)}
label{display:block;font-size:13px;color:var(--mut);margin:12px 0 6px}
input{width:100%;padding:12px;border-radius:10px;border:1px solid var(--line);background:#0e1813;color:var(--fg);font-size:16px}
button{width:100%;padding:14px;border:0;border-radius:12px;background:var(--acc);color:#04210f;font-weight:700;font-size:16px;margin-top:14px}
button.sec{background:transparent;color:var(--acc);border:1px solid var(--line);margin-top:8px}
#msg{margin-top:14px;font-weight:600}.ok{color:var(--acc)}.bad{color:#ff7a6b}
a{color:var(--acc)}
</style></head><body><main>
<h1>✈ FlightRadar</h1>
<p>Choose the Wi-Fi network this radar should use.</p>
<div class="card"><div id="list">Scanning for networks…</div>
<button class="sec" onclick="scan()">Scan again</button></div>
<div class="card">
<label for="ssid">Network name</label><input id="ssid" autocomplete="off" autocapitalize="none">
<label for="pass">Password</label><input id="pass" type="password" autocomplete="off">
<label style="display:flex;gap:8px;align-items:center;color:var(--fg)"><input type="checkbox" style="width:auto" onchange="pass.type=this.checked?'text':'password'"> Show password</label>
<button id="go" onclick="connect()">Connect</button>
<div id="msg"></div></div>
</main><script>
const $=id=>document.getElementById(id);
function bars(r){return r>-55?'▂▄▆█':r>-67?'▂▄▆':r>-78?'▂▄':'▂'}
async function scan(){
  $('list').textContent='Scanning for networks…';
  try{const n=await (await fetch('/api/scan')).json();
    $('list').innerHTML='';
    if(!n.length)$('list').textContent='No networks found. Type the name below.';
    n.sort((a,b)=>b.rssi-a.rssi).forEach(x=>{const d=document.createElement('div');d.className='net';
      d.innerHTML=`<span></span><small>${x.open?'open ':'🔒 '}${bars(x.rssi)}</small>`;d.firstChild.textContent=x.ssid;
      d.onclick=()=>{document.querySelectorAll('.net').forEach(e=>e.classList.remove('sel'));d.classList.add('sel');$('ssid').value=x.ssid;$('pass').focus()};
      $('list').appendChild(d)});
  }catch(e){$('list').textContent='Scan failed. Type the name below.'}
}
async function connect(){
  const ssid=$('ssid').value.trim();if(!ssid){$('msg').textContent='Pick a network first.';return}
  $('go').disabled=true;$('msg').className='';$('msg').textContent='Connecting… this takes up to 25 seconds.';
  try{await fetch('/api/wifi',{method:'POST',headers:{'X-FR':'1','Content-Type':'application/json'},body:JSON.stringify({ssid,pass:$('pass').value})})}catch(e){}
  for(let i=0;i<40;i++){
    await new Promise(r=>setTimeout(r,1000));
    try{const s=await (await fetch('/api/wifi/status')).json();
      if(s.state.startsWith('ok:')){const ip=s.state.slice(3);
        $('msg').className='ok';
        $('msg').innerHTML=`Connected! Rejoin your home Wi-Fi, then open <a href="http://${s.host}">http://${s.host}</a> or <a href="http://${ip}">http://${ip}</a> to finish setup. The address is also shown on the radar.`;
        $('go').disabled=false;return}
      if(s.state==='fail'){$('msg').className='bad';$('msg').textContent='Could not connect. Check the password and try again.';$('go').disabled=false;return}
    }catch(e){/* the hotspot may blip while the radio switches channel */}
  }
  $('msg').className='';$('msg').textContent='No answer from the radar. If its screen shows a radar or an address, it worked: rejoin your home Wi-Fi.';$('go').disabled=false;
}
scan();
</script></body></html>
